name: Build Codex

on:
  # Daily: the agent ships often. The run is skipped unless serverbox-debian or the npm package
  # changed since the last build.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.codex
      - 'assets/agents/**'
  # Rebuild on top of a freshly built Debian image.
  workflow_run:
    workflows: [Build Debian]
    types: [completed]
    branches: [master]

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: serverbox-codex
      upstream_image: ghcr.io/madeye/serverbox-debian:latest
      version_packages: "@openai/codex"
      dockerfile: Dockerfile.codex
      platforms: linux/amd64,linux/arm64
    secrets: inherit
