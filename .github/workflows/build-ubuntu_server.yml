name: Build Ubuntu Server

on:
  schedule:
    - cron: '0 11 * * 1'  # every Monday 11:00 UTC (staggered from desktop images)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.ubuntu_server
      - 'input/**'
      - 'assets/common/**'

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: andlin-ubuntu
      upstream_image: ubuntu:latest
      dockerfile: Dockerfile.ubuntu_server
      platforms: linux/amd64,linux/arm64,linux/arm/v7
    secrets: inherit
