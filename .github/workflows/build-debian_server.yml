name: Build Debian Server

on:
  schedule:
    - cron: '0 12 * * 1'  # every Monday 12:00 UTC (staggered from desktop images)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.debian_server
      - 'input/**'
      - 'assets/common/**'

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: serverbox-debian
      upstream_image: debian:latest
      dockerfile: Dockerfile.debian_server
      platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
    secrets: inherit
