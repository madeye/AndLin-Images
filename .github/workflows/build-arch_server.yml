name: Build Arch Server

on:
  schedule:
    - cron: '0 14 * * 1'  # every Monday 14:00 UTC (staggered from desktop images)
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.arch_server
      - 'input/**'
      - 'assets/common/**'

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    with:
      image_name: andlin-arch
      # Track the ARM image; archlinux:latest (amd64) is also a base but single-arch
      upstream_image: menci/archlinuxarm:latest
      dockerfile: Dockerfile.arch_server
      platforms: linux/amd64,linux/arm64,linux/arm/v7
    secrets: inherit
